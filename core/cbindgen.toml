# Header for Devload.app: `make header` regenerates include/devload.h.
language = "C"
include_guard = "DEVLOAD_H"
autogen_warning = "/* Generated by cbindgen from core/src/ffi.rs. Do not edit: run `make header`. */"
sys_includes = ["stdbool.h", "stdint.h"]
no_includes = true
documentation = true
documentation_style = "c99"

[export]
include = ["DlEvent", "DlRow", "DlSnapshot", "DlSeriesMeta", "DlPart", "DlParts"]
item_types = ["constants", "structs", "functions", "typedefs"]
# Only the dl_* API: everything else cbindgen finds in the crate stays out.
exclude = [
  "TIGHT_AVAIL_PCT", "STEP_DOWN_SECS", "MAX_BODY", "LIST_ROWS", "FLUSH_SECS",
  "MAINTENANCE_SECS", "WAKE_GAP_SECS", "STACKS_MAX_AGE", "TOP_PROCS", "GROUP_MIN_BYTES",
  "RING_SECS", "MIB", "ARGS_MAX_CHARS", "NO_DATA", "SCHEMA_VERSION", "TICK_SECONDS",
  "RETENTION_MINUTE_DAYS", "RETENTION_HOUR_DAYS", "MAX_ARGS", "MAX_ARG_LEN",
  "PARTS_ROWS", "VM_LABEL", "STOP_GRACE_SECS",
  "responsibility_get_pid_responsible_for_pid",
]

[parse]
parse_deps = false

[fn]
sort_by = "None"
