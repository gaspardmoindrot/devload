[package]
name = "devload_core"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
description = "devload core: collects, classifies, stores and serves memory load per dev project"
license = "MIT"
publish = false

[lib]
# staticlib: linked into Devload.app. rlib: for tests, benches and the dev probe.
crate-type = ["staticlib", "rlib"]

[dependencies]
libc = "=0.2.186"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
sha2 = "0.10"

[dev-dependencies]
criterion = { version = "0.7", default-features = false }

[[bench]]
name = "tick"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"

[profile.bench]
inherits = "release"
strip = false
