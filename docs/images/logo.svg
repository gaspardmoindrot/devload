<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>devload</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3440"/>
      <stop offset="1" stop-color="#14161B"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A9BFF"/>
      <stop offset="1" stop-color="#0A6CDB"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB340"/>
      <stop offset="1" stop-color="#F08A00"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CF7BF6"/>
      <stop offset="1" stop-color="#A447E0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#30D158" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#30D158" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>

  <g clip-path="url(#tile)">
    <!-- grid -->
    <g stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="4">
      <line x1="100" y1="420" x2="924" y2="420"/>
      <line x1="100" y1="560" x2="924" y2="560"/>
      <line x1="100" y1="700" x2="924" y2="700"/>
    </g>
    <!-- stacked groups, drawn top layer first -->
    <path fill="url(#purple)" d="M100 590 C230 560 320 470 450 500 S680 440 760 400 S880 360 924 350 L924 924 L100 924 Z"/>
    <path fill="url(#orange)" d="M100 665 C240 640 330 585 460 610 S690 560 770 535 S880 505 924 500 L924 924 L100 924 Z"/>
    <path fill="url(#blue)" d="M100 750 C250 735 340 690 470 710 S700 670 780 650 S885 630 924 625 L924 924 L100 924 Z"/>
    <!-- memory used line -->
    <path fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="10" stroke-linecap="round"
          d="M100 590 C230 560 320 470 450 500 S680 440 760 400 S880 360 924 350"/>
    <!-- inner highlight -->
    <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4"/>
  </g>

  <!-- pressure dot -->
  <circle cx="270" cy="268" r="110" fill="url(#glow)"/>
  <circle cx="270" cy="268" r="54" fill="#30D158"/>
</svg>
