name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows (actionlint, shellcheck)
        env:
          ACTIONLINT: "1.7.12"
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT"
          tarball="actionlint_${ACTIONLINT}_linux_amd64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSL "$base/actionlint_${ACTIONLINT}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          tar xzf "$tarball" actionlint
          ./actionlint -color
      - name: Shell scripts
        run: shellcheck scripts/*.sh

  test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
      - name: Install cbindgen
        run: cargo install cbindgen --locked
      - name: Header is up to date
        run: make header
      - name: Clippy
        run: cargo clippy --release --manifest-path core/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: make test
      - name: Build the app
        run: make app
      - name: Check the app bundle
        run: scripts/check-app.sh build/Devload.app
      - name: Snapshots
        run: make snapshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshots
          path: build/snapshots
          retention-days: 14
