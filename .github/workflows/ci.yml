name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Install cbindgen
        run: cargo install cbindgen --locked
      - name: Header is up to date
        run: make header
      - name: Clippy
        run: cargo clippy --release --manifest-path core/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: make test
      - name: Build the app
        run: make app
      - name: Snapshots
        run: make snapshots
      - uses: actions/upload-artifact@v7
        with:
          name: snapshots
          path: build/snapshots
